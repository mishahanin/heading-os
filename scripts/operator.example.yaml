# Operator identity - EXAMPLE / TEMPLATE
# =======================================
# Who runs this HEADING OS instance. The engine ships this generic example so a
# fresh public clone resolves to a neutral "operator" with no personal defaults.
#
# This is the engine-shipped EXAMPLE. The real file is private per-instance DATA:
# copy it to your data overlay at  <data-root>/config/operator.yaml
# (resolved via get_data_config_dir(), the same place admin.json lives) and fill
# in your own values. That file is gitignored / routed private and never ships in
# the engine.
#
# Resolution precedence (highest wins), see scripts/utils/operator_identity.py:
#   1. environment  HEADING_OS_OPERATOR_{NAME,SLUG,GITHUB_ORG,VOICE_REFERENCE,EMAIL}
#   2. data overlay <data-root>/config/operator.yaml
#   3. engine-local config/operator.yaml   (gitignored; for a data-less clone)
#   4. this shipped example (the generic defaults below)

# Display name, e.g. "Ada Lovelace".
name: "Operator"

# Short kebab-case handle used for per-instance paths and identity, e.g. "ada-lovelace".
slug: "operator"

# GitHub org / owner that hosts your private data + corporate repos, e.g. "adalovelace".
# Leave empty on a fresh clone; set it when you create your repos.
github_org: ""

# Workspace-relative path to your voice reference file. The accessor only surfaces
# this path; it never dereferences it. Supply your own via the data overlay.
voice_reference: "reference/voice.md"

# Operator email used in generated correspondence, e.g. "ada@example.com".
email: ""

# Your organisation's CORPORATE mail domain, BARE and with no "@", e.g.
# "example.com". Not the domain half of `email` above: the two are routinely
# different, and this one is the company's, not yours. It decides which mail
# threads count as internal and which CRM contacts hold a company mailbox
# without being typed as Tribe. Leave empty and both checks stay silent, which
# is the correct behaviour for a clone that has no corporate domain.
corporate_email_domain: ""

# The inbox that reaches whoever ADMINISTERS this fleet. A whole address, not a
# domain. This is NOT `email` above: `email` is whoever runs this clone, and on
# an executive's workspace that is the executive, so a skill request routed to
# it would mail them their own request. On a single-operator workspace the two
# are the same person, which is exactly why the difference is easy to miss.
#
# Read by `/request-skill` (where an executive asks for a new capability) and by
# the fireside bot's backup email, which offers it as "reach a human". Leave it
# empty and both fall back to `email`, then refuse rather than send to nobody.
admin_email: ""
