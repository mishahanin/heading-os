<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>side-tab fixture</title>
<style>
  body { font-family: "GT Standard", Georgia, serif; background: #ffffff; color: #1a1a2e; }
  .callout {
    border-left: 4px solid #5b5fff;
    border-radius: 8px;
    padding: 16px 20px;
    background: #f6f6fc;
  }
</style>
</head>
<body>
<h1>A page whose only defect is the stripe</h1>
<div class="callout">
  <p>A coloured stripe down one side of a rounded card. The stripe fights the corner
  radius, and it is the single most recognisable tell of a generated interface.</p>
</div>
</body>
