# HEADING OS engine CI (F-1.2) - proves what the README claims.
#
# Jobs: guards (identity of the project) -> lint -> security-tests -> unit-tests.
# Every action is pinned by commit SHA (F-1.5). Every step here was verified to
# run headless on this data-less engine tree before commit.
#
# FIRST-PUSH NOTE (operator): the unit-tests job runs the full non-integration
# suite. Since the extras split (F-7.1) landed, every `uv sync` here uses
# `--dev --all-extras --frozen` so CI installs the whole dependency set (core +
# all optional extras) and no capability test is skipped for a missing extra -
# EXCEPT browser binaries (playwright) and anything needing live network. If a
# browser/network test fails, mark it with the capability markers added in F-2.2
# (`requires_playwright` / `requires_network`) and exclude it here, then widen.
# `guards` + `security-tests` are the checks to make required on `main`.
name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Match the session TZ the test suite pins in tests/conftest.py: Etc/GMT-4 is
  # UTC+4 with no DST (a neutral fixed offset, not a location signal). The
  # tz-sensitive calendar/pulse tests assert +4 local-time math; a bare UTC here
  # overrides the conftest default and fails them.
  HEADING_OS_TZ: Etc/GMT-4

jobs:
  guards:
    name: sovereignty guards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because this is the job that runs the Canopus
          # clauses, and three of the four reach commits that depth 1 does not
          # fetch. Each note names an `approval_sha`: C1 diffs the contract
          # between that commit and the end state, C2 asks `git merge-base
          # --is-ancestor` whether the implementation descends from it, and C3
          # checks the contract out THERE in a worktree and runs it. The
          # `--range` scoping adds a `git rev-list`. checkout defaults to depth
          # 1, where every one of those objects is absent: the clause either
          # errors on an unknown object or finds one commit and passes
          # vacuously, which is worse - a green check that measured nothing.
          #
          # No clause reads a genesis epoch. This comment said one walked to
          # `--is-ancestor <genesis>` until 2026-08-07; that stopped being true
          # when the check moved from walking commits to reading committed
          # notes, and `config/canopus-genesis.json` was deleted with the last
          # thing that read it. The setting is right, the old reason was not.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      - run: uv sync --dev --all-extras --frozen
      - name: Leak guard (no hardcoded data paths in engine code)
        run: git ls-files '*.py' '*.sh' | xargs uv run python scripts/leak-guard.py check-paths --files
      - name: Engine tree clean (no data-class artifact in the engine clone)
        run: uv run python -m pytest tests/test_engine_tree_clean.py tests/test_data_root_no_bypass.py -q
      - name: Skill router registry generated + in sync (F-5.1)
        run: uv run python scripts/generate-skill-router.py --check
      - name: Canopus record check (reports, does not block a direct push)
        # The name is the honest limit, and it is not modesty. `enforce_admins`
        # is false on the only push path in use, so a required check cannot
        # actually stop a direct push to main; any sentence giving this step a
        # verb of refusal would be an overclaim. It REPORTS: a red step here is
        # a loud, dated, permanent record that a slice's note stopped matching
        # the repository, seen by whoever reads the run.
        #
        # The exit code is deliberately NOT swallowed with `|| true`. A step
        # that can never be observed failing is the exact defect this whole
        # design exists to remove -- exit 0 would then mean "nothing was
        # observed", not "the clauses held".
        #
        # `github.event.before` is EMPTY on a pull_request and on
        # workflow_dispatch, and forty zeros on the first push to a new branch,
        # so this expands to `..<sha>` or `000...000..<sha>` on those events.
        # canopus_check reads an endpoint that names no commit as a push it
        # cannot scope, and runs the two cheap clauses over every note while
        # scoping the two expensive ones (a worktree plus a test run each) to
        # nothing. It never errors on the shape, which would read as a failure
        # of the slice rather than of the range.
        #
        # This deliberately keeps calling `scripts/canopus_check.py` and NOT the
        # `scripts/canopus.py check` subcommand that landed in 42b14fa. That
        # subcommand is a passthrough to this module's own `main`, so the two
        # are one implementation and there is no verdict to diverge; what
        # differs is what gets imported to reach it. `canopus.py` pulls in the
        # contract prober and the null-stub plugin, none of which a clause run
        # touches, so routing CI through it would widen this step's blast
        # radius to modules it does not use. The module is the entry point; the
        # subcommand exists so an operator has one command to remember.
        run: uv run python scripts/canopus_check.py --range "${{ github.event.before }}..${{ github.sha }}"
      - name: Rule split inventory drift guard (D4)
        # No-op until a rule split/compression writes a snapshot under
        # config/rule-split-inventory/; then it fails the build if a later edit drops a
        # snapshotted directive from a compressed or split always-on rule file.
        run: uv run python scripts/rule_split_check.py --check
      - name: Skill metadata contract
        run: uv run python scripts/skill-metadata-check.py
      - name: Version sync (F-1.1)
        run: uv run python scripts/check-version-sync.py --quiet
      - name: detect-secrets baseline drift (F-9.4)
        run: uv run detect-secrets scan --baseline .secrets.baseline
      - name: Vendored-skill hashes (F-9.5)
        run: uv run python scripts/verify-skills-lock.py --check
      - name: Skill bash-path audit (F-9.3)
        run: uv run python scripts/audit-skill-bash-paths.py
      - name: Classification health (F-9.3)
        run: uv run python scripts/classification-health.py
      - name: requirements.txt in sync with the lock (F-7.1)
        # Byte-identical to the regen command; uv writes a header echoing this
        # exact argv, so any drift (or a hand-edited header) fails the diff.
        run: |
          uv export --no-hashes --no-dev --all-extras --no-emit-project --format requirements-txt > /tmp/req.txt
          diff -u requirements.txt /tmp/req.txt
      - name: Docs HTML in sync (F-8.1)
        # --all regenerates every md-sourced page, nav-syncs + search-injects the
        # hand-authored pages, and rebuilds the search index in one pass. Any drift
        # (a .md edited without regenerating, a stale nav/search injection) fails the
        # diff. Combined mode flags short-circuit, so --all is the canonical command.
        run: |
          uv run python scripts/regenerate-docs-html.py --all
          git diff --exit-code docs/
      - name: README numbers in sync (F-8.3)
        # Re-derives the security-test count (collecting tests/security) and the
        # guard-layer constant, and fails if the README or docs/index.html
        # "By the numbers" block disagrees.
        run: uv run python scripts/dev/check-readme-numbers.py
      - name: Design ratchet (no NEW visual findings on docs/)
        # The deep engine (impeccable, pinned in scripts/.impeccable-version)
        # resolves the CSS cascade and computes what the page actually renders:
        # contrast against the real backdrop, heading hierarchy, accent stripes.
        #
        # This gates REGRESSIONS only. `.visual-baseline.json` freezes the 390
        # findings that existed on 2026-08-09 - they are recorded, deliberately
        # not remediated, and listed in the calibration report. A finding ABOVE
        # that line fails the build.
        #
        # `|| true` on the npm reach, not on the check: a design gate that goes
        # red because the registry was slow teaches people to ignore it, and the
        # checker already exits 0 with one degradation line when the CLI cannot
        # be resolved. What it will never do is pass a real regression quietly.
        run: |
          node --version || echo "node unavailable; the check will report and pass"
          uv run python scripts/visual-discipline-check.py baseline check --deep docs/

  lint:
    name: ruff + bandit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      - run: uv sync --dev --all-extras --frozen
      - name: ruff - blocking security subset (mirror of the pre-commit gate)
        run: uv run ruff check . --select S --ignore S101,S105,S310,S603,S607
      - name: ruff - full-ruleset ratchet (F-3.2, fails on NEW lint debt)
        run: uv run python scripts/lint-ratchet.py check
      - name: bandit
        run: uv run bandit -c pyproject.toml -r scripts .claude/hooks -q --severity-level medium --confidence-level medium

  security-tests:
    name: security suite (the money badge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      - run: uv sync --dev --all-extras --frozen
      - run: uv run pytest tests/security -q -p no:cacheprovider

  unit-tests:
    name: unit tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, because this job is the one that collects
          # tests/contract/. A Canopus contract may prove its checker against
          # the REAL past defect by reading a historical blob
          # (`git show <sha>:<path>`), which is the "fixture must carry the
          # shape the real source produces" rule applied to the contract
          # itself. checkout defaults to depth 1, where those objects are
          # absent and `git show` fails, so the test ERRORS instead of
          # measuring anything. Measured 2026-08-02: a depth-1 clone answers
          # `fatal: invalid object name 'a2cb7d1^'` for the production-shape
          # contract's A/B pair.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
      - run: uv python install ${{ matrix.python }}
      - run: uv sync --dev --all-extras --frozen --python ${{ matrix.python }}
      - name: unit + capability tests (integration/acceptance excluded)
        run: >
          uv run pytest tests/ -q -p no:cacheprovider
          -m "not integration and not acceptance"
          --cov=scripts/utils --cov-report=term

  integration-tests:
    # The `integration` marker is excluded from every other job, so until now
    # tests/integration/ ran nowhere in CI. That blind spot is how the LFS
    # fixture defect reached a release: the six convert-to-md cases that read a
    # `.docx` were only ever exercised on an operator's machine, where the
    # fixtures happen to be resolved. 35 tests, ~18s -- cheap to hold honestly.
    name: integration tests (mocked services)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The ONLY job that needs the LFS blobs: the .docx fixtures are LFS
          # objects, and without them these tests skip rather than measure.
          lfs: true
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true
      - run: uv python install 3.11
      - run: uv sync --dev --all-extras --frozen --python 3.11
      - name: LFS fixtures resolved (a skipped fixture test proves nothing)
        run: uv run python scripts/dev/check-lfs-fixtures.py
      - name: integration tests
        run: uv run pytest tests/ -q -p no:cacheprovider -m integration

  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    # Build the SBOM on real refs (main + tags), not on every PR.
    if: github.event_name == 'push'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          prune-cache: true   # v9 flipped this default to false
          # Pin uv so the experimental cyclonedx export format cannot shift silently.
          version: "0.11.21"
      - name: Generate CycloneDX SBOM (F-9.6)
        # `--format cyclonedx1.5` is experimental and writes to stdout (the -o flag
        # yields no file), so redirect. The preview flag stabilizes step success.
        run: uv export --format cyclonedx1.5 --preview-features sbom-export > sbom.cdx.json
      - name: Guard non-empty SBOM
        run: test -s sbom.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
