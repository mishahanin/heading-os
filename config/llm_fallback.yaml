# LLM fallback configuration - Track A (failover) of the LLM-fit logging project.
# See plans/2026-05-24-llm-fit-logging-three-tracks.md.
#
# Maps Anthropic model tier to an ordered fallback chain. When the primary
# (Anthropic) call fails with a retriable error (5xx, 429, timeout, connection
# reset), llm_fallback.call_anthropic_with_fallback() cascades through the
# named vendors using the existing council wrappers (gemini-consult.py,
# grok-consult.py, kimi-consult.py) imported as libraries (NOT subprocess).
# The wrappers now route through CLIProxyAPI (see the proxy-transport
# migration plan) rather than calling each vendor's API directly; vendor
# `kimi` (`consult_kimi()`) is a supported chain step alongside `gemini` and
# `grok`. `llm_fallback` deliberately pins the kimi step to the
# `kimi-for-coding` proxy model (fast, quota-light) - it does not use k3 and
# does not pass `reasoning_effort`.
#
# Permanent errors (401/403 auth fail, 400 bad request) are NOT retried -
# fallback would just waste budget on a request the next vendor would also
# reject.
#
# Tier resolution: caller passes the full Anthropic model string (e.g.
# "claude-haiku-4-5-20251001"). Module derives tier by substring match:
#   "haiku"  -> haiku
#   "sonnet" -> sonnet
#   "opus"   -> opus
#
# Vendor strings are case-sensitive identifiers expected by llm_fallback:
#   gemini-3.1-flash-lite, gemini-3-flash, gemini-3.1-pro-low -> consult_gemini()
#   grok-3-mini-fast, grok-4.5                                -> consult_grok()
#   kimi-for-coding                                           -> consult_kimi()
#
# Cross-vendor model choice is informed by Artificial Analysis benchmarks.
# Kimi leads the sonnet/opus chains (proxy-transport migration, kimi-for-coding
# tier). Re-check when AA publishes a new Index version or when a tier gains
# a materially-better peer.

tiers:
  haiku:
    chain:
      - vendor: gemini
        model: gemini-3.1-flash-lite
      - vendor: grok
        model: grok-3-mini-fast
  sonnet:
    chain:
      - vendor: kimi
        model: kimi-for-coding
      - vendor: gemini
        model: gemini-3-flash
      - vendor: grok
        model: grok-4.5
  opus:
    chain:
      - vendor: kimi
        model: kimi-for-coding
      - vendor: gemini
        model: gemini-3.1-pro-low
      - vendor: grok
        model: grok-4.5

# Errors that trigger fallback (retriable). Other errors re-raise immediately.
# Class names match the anthropic Python SDK exception hierarchy.
retriable_anthropic_errors:
  - APIConnectionError
  - APITimeoutError
  - RateLimitError       # 429 - transient capacity, fallback vendor may not be throttled
  - InternalServerError  # 5xx
